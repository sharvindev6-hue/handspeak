<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HANDSPEAK — pose contact sheet</title>
    <style>
      body { margin: 0; background: #0a0e14; color: #dce7f2; font-family: Consolas, monospace; }
      h1 { font-size: 16px; padding: 12px 16px 0; margin: 0; color: #35e0ff; }
      #wrap { position: relative; width: 100%; }
      canvas { display: block; width: 100%; }
      #labels {
        position: absolute; inset: 0;
        display: grid; grid-template-columns: repeat(13, 1fr); grid-template-rows: 1fr 1fr;
        pointer-events: none;
      }
      #labels div { display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; font-size: 15px; color: #7cffb2; }
    </style>
  </head>
  <body>
    <h1>ASL alphabet — robot hand poses (A–M top, N–Z bottom)</h1>
    <div id="wrap">
      <canvas id="c"></canvas>
      <div id="labels"></div>
    </div>
    <script type="module" src="/src/poses-test.ts"></script>
  </body>
</html>
